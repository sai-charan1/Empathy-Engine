name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip hatchling
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check empathy_engine app.py cli.py tests/

      - name: Black
        run: black --check empathy_engine app.py cli.py tests/

      - name: MyPy
        run: mypy empathy_engine app.py cli.py

      - name: Pytest
        run: pytest tests/ -v
